plugins {
    id 'com.android.application'
}

def gitSha() {
    try {
        def out = 'git rev-parse --short HEAD'.execute([], rootDir).text.trim()
        return out ? out : 'nogit'
    } catch (Exception ignored) { return 'nogit' }
}

// Подпись release: ключ и пароли в secrets.properties (вне git, см. secrets.properties.example).
// Без них сборка подписывается debug-ключом и предупреждает: такой APK не встанет поверх боевого.
def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.exists()) secretsFile.withInputStream { secrets.load(it) }
def releaseKeystore = secrets.getProperty('KEYSTORE_FILE') ? rootProject.file(secrets.getProperty('KEYSTORE_FILE')) : null
def hasReleaseKey = releaseKeystore != null && releaseKeystore.exists() && secrets.getProperty('KEYSTORE_PASSWORD')
if (!hasReleaseKey) logger.warn('WARNING: secrets.properties / release.keystore не найдены — release подписывается debug-ключом')

android {
    namespace 'kz.kurultai.assistant'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'kz.kurultai.assistant'
        minSdk 23
        targetSdk 29
        versionCode 74
        // Штамп версии: git sha + дата сборки, чтобы версию было видно на роботе (бейдж подключения).
        versionName "5.50-${gitSha()}-${new Date().format('yyyyMMdd')}"
        buildConfigField 'String', 'EMBEDDED_OPENAI_KEY', '"' + (System.getenv('KURULTAI_EMBEDDED_OPENAI_KEY') ?: '') + '"'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile releaseKeystore
                storePassword secrets.getProperty('KEYSTORE_PASSWORD')
                keyAlias secrets.getProperty('KEY_ALIAS', 'kurultai')
                keyPassword secrets.getProperty('KEY_PASSWORD', secrets.getProperty('KEYSTORE_PASSWORD'))
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation files('libs/robotservice.jar')
    // RobotApi.<clinit> constructs Gson; RobotOS does not expose Gson to third-party APKs.
    implementation 'com.google.code.gson:gson:2.10.1'
}
